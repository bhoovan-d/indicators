name: daily-scrape
on:
  schedule:
    - cron: "0 2 * * *"    # 07:30 IST: fuel (6 AM revision), gold AM, mandi, stocks
    - cron: "30 11 * * *"  # 17:00 IST: CPCB 4 PM AQI bulletin, gold PM
  workflow_dispatch:
  push:                    # rerun whenever the scraper itself changes
    branches: [main]
    paths: ["scrape.py", "requirements.txt", ".github/workflows/scrape.yml"]
permissions:
  contents: write
concurrency: scrape
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scrape.py
        env:
          DATA_GOV_KEY: ${{ secrets.DATA_GOV_KEY }}
      - name: Commit data
        run: |
          git config user.name "india-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/indicators.json
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M') IST"
          git push
